name: CI/CD
run-name: ${{ github.actor }} is deploing out tms with GitHub Actions 🚀
on:
  push:
    branches:
      - master
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TimeManagementService.sln

      - name: Build
        run: dotnet build TimeManagementService.sln --configuration Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: task-management-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: task-management-ui
        run: npm ci

      - name: Build frontend
        working-directory: task-management-ui
        run: npm run build

  database-migration-check:
    name: Check database migration script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Restore migrations project
        run: |
          dotnet restore \
            TimeManagementService.DataAccess.Migrations/TimeManagementService.DataAccess.Migrations.csproj

      - name: Generate migration script
        run: |
          dotnet ef migrations script \
            --idempotent \
            --project TimeManagementService.DataAccess.Migrations \
            --startup-project TimeManagementService.DataAccess.Migrations \
            --output /tmp/TimeManagementDB.sql

      - name: Compare migration script with repository
        run: |
          diff -u \
            Databases/TimeManagementDB.sql \
            /tmp/TimeManagementDB.sql

  deploy:
    name: Deploy to Timeweb
    runs-on: ubuntu-latest
    needs:
      - build
      - database-migration-check
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            cd /var/www/tms
            git fetch origin
            git reset --hard origin/master
            bash scripts/deploy.sh