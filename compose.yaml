services:
  timemanagementservice:
    image: timemanagementservice
    build:
      context: .
      dockerfile: TimeManagementService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=TasksDB;Username=postgres;Password=${POSTGRES_PASSWORD}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: timemanagement-ui
    build:
      context: ./task-management-ui
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - timemanagementservice

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: TasksDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d TasksDB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: